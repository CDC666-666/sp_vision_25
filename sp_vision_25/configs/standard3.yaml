enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 1.5 # degree -2.5
pitch_offset: 2 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

# 2026-09-20: handeye_run01标定，handeye_run02独立数据一致性复验。
# 串口INS已在电控端换轴；按相机朝前约定使用以下映射。
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 图像尺寸1440×1080；相机内参标定平均重投影误差0.2670 px。
camera_matrix: [1758.3221582579527, 0, 616.8676402586328, 0, 1754.776696645133, 592.6919205734052, 0, 0, 1]
distort_coeffs: [-0.0778378237908365, 0.09783980306126952, 0.004202746072742955, -0.008161116790908984, 0]

# 相机同理想情况的偏角: yaw-1.97 pitch-0.31 roll2.01 degree
# run02: 18/18有效，固定棋盘位置RMS偏差4.56 mm，最大偏离均值5.93 mm。
# 以下平移单位为米；上述一致性偏差不代表绝对测量精度。
R_camera2gimbal: [0.03420779763718286, -0.006533729401004698, 0.9993933844892751, -0.9987992592966356, 0.03486573754044772, 0.03441540315400422, -0.03506944837469756, -0.9993706473205399, -0.00533320399191343]
t_camera2gimbal: [0.04743650171061373, 0.018919074669373308, 0.08907911106472413]
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_3073357E3034-if00"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
